name: Build APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Inyectar Clave API de Resend
        run: |
          sed -i 's/CLAVE_FALSA_AQUI/${{ secrets.RESEND_API_KEY }}/g' main.py
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer cython virtualenv
          
      # Aceptar licencias de Android SDK e instalar Aidl
      - name: Aceptar Licencias y Preparar SDK
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          yes | sdkmanager --licenses
          sdkmanager "build-tools;37.0.0" "platform-tools" "platforms;android-33"
          echo "Aidl: $(which aidl)"
          
      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          yes | buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: misgastos-apk
          path: bin/*.apk
